[preferred]
# Default backend (AppChooser, Print, Settings, Notification, ...) -> gtk,
# since the gnome backend's other interfaces expect a running GNOME shell.
default=gtk
# Use the GTK4/libadwaita GNOME file picker (matches Nautilus) for open/save dialogs.
org.freedesktop.impl.portal.FileChooser=gnome
# Screenshot/ScreenCast stay on wlr (set in /usr/share/xdg-desktop-portal/sway-portals.conf).
