icons_format = "{icon}"

[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#11111188"
idle_fg = "#eeeeee"
info_bg = "#11111188"
info_fg = "#eeeeee"
good_bg = "#11111188"
good_fg = "#98c379"
warning_bg = "#11111188"
warning_fg = "#e5c07b"
critical_bg = "#11111188"
critical_fg = "#e06c75"
separator = "│"
separator_bg = "#00000000"
separator_fg = "#00000000"
alternating_tint_bg = "#00000000"
alternating_tint_fg = "#00000000"

[icons]
icons = "awesome6"

[[block]]
block = "temperature"
interval = 5
format = " 󰔏  $max "
click = [{ button = "left", cmd = "alacritty -e htop" }]

[[block]]
block = "net"
device = "wlan0"
format = " 󰤨  $ssid $signal_strength "
missing_format = ""
click = [{ button = "left", cmd = "nm-connection-editor" }]

[[block]]
block = "sound"
driver = "auto"
click = [
  { button = "left", cmd = "pavucontrol" },
  { button = "right", cmd = "pactl set-sink-mute @DEFAULT_SINK@ toggle" }
]

[[block]]
block = "time"
interval = 30
format = "   $timestamp.datetime(f:'%a %d %b  %H:%M') "

[[block]]
block = "battery"
device = "BAT1"
driver = "sysfs"
format = " $icon $percentage $time "
full_format = " $icon $percentage "
